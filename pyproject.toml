[project]
name = "enterprise-knowledge-intelligence"
version = "0.1.0"
description = "Production-oriented enterprise RAG platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyarrow>=17.0",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "torch==2.8.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "bm25s>=0.3.16",
    "pystemmer>=3.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests that require downloaded real data or PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
