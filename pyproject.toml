[project]
name = "enterprise-knowledge-intelligence"
version = "0.1.0"
description = "Production-oriented enterprise RAG platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyarrow>=17.0",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
