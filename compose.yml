name: production-rag

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: production-rag-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: production-rag-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
